# Format check only: n=5 on Llama-3.3-70B to confirm the model emits the
# VERDICT: ACCEPT/REJECT and FINAL ANSWER: markers the parser needs before we
# spend on the full 200-problem run. Throwaway output dir.
provider: openai
base_url: https://api.deepinfra.com/v1/openai
api_key_env: DEEPINFRA_API_KEY
model: meta-llama/Llama-3.3-70B-Instruct-Turbo
temperature: 0.0
robustness_temperature: 0.7
robustness_seeds: [13, 42, 2026]

dataset:
  name: gsm8k
  split: test
  n_problems: 5
  sample_seed: 42

conditions:
  A: {pipeline: false}
  B: {pipeline: true,  inject_stage: null, verifier: true}
  C2: {pipeline: true, inject_stage: solver, verifier: true}

injection:
  types: [number_swap, operation_flip]
  seed: 7
  severity:
    mild: [0.9, 1.1]
    moderate: [0.4, 0.6, 1.4, 1.6]
    severe: [3.5, 4.0, negate]

output_dir: results/traces_parsecheck
max_tokens: 1024
