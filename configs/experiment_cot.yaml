# Config for Claude Sonnet using Chain-of-Thought Verifier Strategy
provider: anthropic
model: claude-sonnet-4-6
temperature: 0.0
robustness_temperature: 0.7
robustness_seeds: [13, 42, 2026]

dataset:
  name: gsm-hard
  split: test
  n_problems: 200
  sample_seed: 42

conditions:
  A: {pipeline: false}
  B: {pipeline: true,  inject_stage: null, verifier: true}
  C1: {pipeline: true, inject_stage: decomposer, verifier: true}
  C2: {pipeline: true, inject_stage: solver,     verifier: true}
  D1: {pipeline: true, inject_stage: decomposer, verifier: false}
  D2: {pipeline: true, inject_stage: solver,     verifier: false}

injection:
  types: [number_swap, operation_flip, semantic_logic_error]
  seed: 7
  severity:
    mild: [0.9, 1.1]
    moderate: [0.4, 0.6, 1.4, 1.6]
    severe: [3.5, 4.0, negate]

verifier_strategy: cot
output_dir: results/traces_cot
max_tokens: 1024
